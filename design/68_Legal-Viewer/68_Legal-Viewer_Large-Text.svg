<filter id="gl-blue" x="-30%" y="-60%" width="160%" height="260%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5B7CFA" flood-opacity="0.32"/></filter>
<filter id="gl-coral" x="-30%" y="-60%" width="160%" height="260%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#E94B4B" flood-opacity="0.30"/></filter>
<filter id="gl-red" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#D9363E" flood-opacity="0.30"/></filter>
<filter id="blur-xl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
<filter id="blur-md" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
<linearGradient id="g-glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.82"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.56"/></linearGradient>
<linearGradient id="g-edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.35"/></linearGradient>
<linearGradient id="g-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B7CFA" stop-opacity="0.82"/><stop offset="1" stop-color="#5B7CFA"/></linearGradient>
<linearGradient id="g-coral" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E94B4B" stop-opacity="0.84"/><stop offset="1" stop-color="#E94B4B"/></linearGradient>
<linearGradient id="g-fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF4D6" stop-opacity="0"/><stop offset="0.55" stop-color="#FFF4D6" stop-opacity="0.85"/><stop offset="1" stop-color="#FFF4D6" stop-opacity="0.95"/></linearGradient>
<radialGradient id="g-halo"><stop offset="0" stop-color="#5B7CFA" stop-opacity="0.20"/><stop offset="1" stop-color="#5B7CFA" stop-opacity="0"/></radialGradient>
</defs>
<g clip-path="url(#screen)">
<rect width="390" height="844" fill="#FFF4D6"/>
<!-- Background clouds (decorative): blurred Blue top-right, Coral bottom-left -->
<g filter="url(#blur-xl)"><path d="M210 -40 C200 40 240 96 286 120 C330 142 336 210 380 250 L460 260 L460 -40 Z" fill="#5B7CFA" class="cl-b1" opacity="0.50"/><ellipse cx="372" cy="70" rx="90" ry="110" fill="#5B7CFA" class="cl-b2" opacity="0.30"/></g><path d="M300 -10 C292 70 330 150 400 196" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1.5"/>
<g filter="url(#blur-xl)"><path d="M-60 560 C20 560 80 620 110 690 C130 740 170 800 200 900 L-60 900 Z" fill="#E94B4B" class="cl-c1" opacity="0.35"/><ellipse cx="0" cy="760" rx="110" ry="120" fill="#E94B4B" class="cl-c2" opacity="0.17"/></g><path d="M-10 640 C60 660 100 720 112 800" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5"/>
<clipPath id="c68"><rect x="0" y="106" width="390" height="636"/></clipPath>
<g clip-path="url(#c68)"><g transform="translate(0 0)">
<text x="24" y="141" text-anchor="start" font-size="26" font-weight="700" fill="#10233F" letter-spacing="-0.4" xml:space="preserve">Terms of Service</text>
<text x="24" y="167" text-anchor="start" font-size="12" font-weight="500" fill="#66758A" xml:space="preserve">Version 3.2 · Effective 1 Oct 2026</text>
<!-- SegmentedTabs (frosted track) -->
<rect x="24" y="183" width="160" height="40" rx="20.0" fill="#FFFFFF" fill-opacity="0.5" stroke="url(#g-edge)" stroke-width="1.2"/>
<rect x="28.0" y="187" width="76.0" height="32" rx="16.0" fill="#FFFFFF" filter="url(#sh-sm)"/>
<text x="66.0" y="208.0" text-anchor="middle" font-size="14" font-weight="600" fill="#5B7CFA" xml:space="preserve">English</text>
<rect class="hit" data-hit="lang:English" x="28" y="183" width="76" height="40" fill="#FFFFFF" fill-opacity="0"/>
<text x="142.0" y="208.0" text-anchor="middle" font-size="14" font-weight="600" fill="#66758A" font-family="'Noto Sans Devanagari', 'Kohinoor Devanagari', sans-serif" xml:space="preserve">हिन्दी</text>
<rect class="hit" data-hit="lang:हिन्दी" x="104" y="183" width="76" height="40" fill="#FFFFFF" fill-opacity="0"/>
<rect x="286" y="183" width="80" height="40" rx="12" fill="#FFFFFF" stroke="#EEF1F5"/><text x="306" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#8794A5" xml:space="preserve">A</text><text x="342" y="209" text-anchor="middle" font-size="18" font-weight="700" fill="#5B7CFA" xml:space="preserve">A</text><rect class="hit" data-hit="textsize:small" x="286" y="179" width="40" height="48" fill="#FFFFFF" fill-opacity="0"/><rect class="hit" data-hit="textsize:large" x="326" y="179" width="40" height="48" fill="#FFFFFF" fill-opacity="0"/>
<text x="24" y="259.3" text-anchor="start" font-size="19" font-weight="700" fill="#10233F" xml:space="preserve">1. Who can use Frndu</text>
<text x="24" y="290.8" text-anchor="start" font-size="17" font-weight="400" fill="#66758A" xml:space="preserve">You must be 18 or older to use Frndu. We</text>
<text x="24" y="316.8" text-anchor="start" font-size="17" font-weight="400" fill="#66758A" xml:space="preserve">verify hosts with a video check before they</text>
<text x="24" y="342.8" text-anchor="start" font-size="17" font-weight="400" fill="#66758A" xml:space="preserve">can take calls.</text>
<text x="24" y="391.3" text-anchor="start" font-size="19" font-weight="700" fill="#10233F" xml:space="preserve">2. Your account</text>
<text x="24" y="422.8" text-anchor="start" font-size="17" font-weight="400" fill="#66758A" xml:space="preserve">Keep your phone number up to date. You</text>
<text x="24" y="448.8" text-anchor="start" font-size="17" font-weight="400" fill="#66758A" xml:space="preserve">are responsible for activity on your</text>
<text x="24" y="474.8" text-anchor="start" font-size="17" font-weight="400" fill="#66758A" xml:space="preserve">account.</text>
<text x="24" y="523.3" text-anchor="start" font-size="19" font-weight="700" fill="#10233F" xml:space="preserve">3. Diamonds and payments</text>
<text x="24" y="554.8" text-anchor="start" font-size="17" font-weight="400" fill="#66758A" xml:space="preserve">Diamonds are a virtual currency used for</text>
<text x="24" y="580.8" text-anchor="start" font-size="17" font-weight="400" fill="#66758A" xml:space="preserve">calls and chat. Diamonds have no cash</text>
<text x="24" y="606.8" text-anchor="start" font-size="17" font-weight="400" fill="#66758A" xml:space="preserve">value for users and are non-refundable</text>
<text x="24" y="632.8" text-anchor="start" font-size="17" font-weight="400" fill="#66758A" xml:space="preserve">except as stated in the Refund Policy.</text>
<text x="24" y="681.3" text-anchor="start" font-size="19" font-weight="700" fill="#10233F" xml:space="preserve">4. Community rules</text>
<text x="24" y="712.8" text-anchor="start" font-size="17" font-weight="400" fill="#66758A" xml:space="preserve">Be respectful. No nudity, harassment,</text>
<text x="24" y="738.8" text-anchor="start" font-size="17" font-weight="400" fill="#66758A" xml:space="preserve">fraud, or sharing of personal contact</text>
<text x="24" y="764.8" text-anchor="start" font-size="17" font-weight="400" fill="#66758A" xml:space="preserve">details. We may end calls, issue strikes, or</text>
<text x="24" y="790.8" text-anchor="start" font-size="17" font-weight="400" fill="#66758A" xml:space="preserve">suspend accounts that break these rules.</text>
<text x="24" y="839.3" text-anchor="start" font-size="19" font-weight="700" fill="#10233F" xml:space="preserve">5. Hosts</text>
<text x="24" y="870.8" text-anchor="start" font-size="17" font-weight="400" fill="#66758A" xml:space="preserve">Hosts earn diamonds from calls after the</text>
<text x="24" y="896.8" text-anchor="start" font-size="17" font-weight="400" fill="#66758A" xml:space="preserve">platform commission. Payouts need</text>
<text x="24" y="922.8" text-anchor="start" font-size="17" font-weight="400" fill="#66758A" xml:space="preserve">completed KYC.</text>
</g></g>
<rect x="0" y="726" width="390" height="118" fill="#FFF4D6"/>
