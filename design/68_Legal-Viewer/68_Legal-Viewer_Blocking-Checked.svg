<text x="24" y="330.8" text-anchor="start" font-size="17" font-weight="700" fill="#10233F" xml:space="preserve">1. Who can use Frndu</text>
<text x="24" y="358.2" text-anchor="start" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">You must be 18 or older to use Frndu. We verify</text>
<text x="24" y="380.2" text-anchor="start" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">hosts with a video check before they can take</text>
<text x="24" y="402.2" text-anchor="start" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">calls.</text>
<text x="24" y="446.8" text-anchor="start" font-size="17" font-weight="700" fill="#10233F" xml:space="preserve">2. Your account</text>
<text x="24" y="474.2" text-anchor="start" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">Keep your phone number up to date. You are</text>
<text x="24" y="496.2" text-anchor="start" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">responsible for activity on your account.</text>
<text x="24" y="540.8" text-anchor="start" font-size="17" font-weight="700" fill="#10233F" xml:space="preserve">3. Diamonds and payments</text>
<text x="24" y="568.2" text-anchor="start" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">Diamonds are a virtual currency used for calls</text>
<text x="24" y="590.2" text-anchor="start" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">and chat. Diamonds have no cash value for users</text>
<text x="24" y="612.2" text-anchor="start" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">and are non-refundable except as stated in the</text>
<text x="24" y="634.2" text-anchor="start" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">Refund Policy.</text>
<text x="24" y="678.8" text-anchor="start" font-size="17" font-weight="700" fill="#10233F" xml:space="preserve">4. Community rules</text>
<text x="24" y="706.2" text-anchor="start" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">Be respectful. No nudity, harassment, fraud, or</text>
<text x="24" y="728.2" text-anchor="start" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">sharing of personal contact details. We may end</text>
<text x="24" y="750.2" text-anchor="start" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">calls, issue strikes, or suspend accounts that</text>
<text x="24" y="772.2" text-anchor="start" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">break these rules.</text>
<text x="24" y="816.8" text-anchor="start" font-size="17" font-weight="700" fill="#10233F" xml:space="preserve">5. Hosts</text>
<text x="24" y="844.2" text-anchor="start" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">Hosts earn diamonds from calls after the</text>
<text x="24" y="866.2" text-anchor="start" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">platform commission. Payouts need completed</text>
<text x="24" y="888.2" text-anchor="start" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">KYC.</text>
</g></g>
