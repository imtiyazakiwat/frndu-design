<clipPath id="vf"><circle cx="195" cy="335" r="140"/></clipPath>
<g clip-path="url(#vf)"><rect x="55" y="195" width="280" height="280" fill="#FDE8E8"/><circle cx="265" cy="255" r="70" fill="#EAF0FF"/>
