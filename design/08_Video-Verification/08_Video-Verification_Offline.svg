</g>
<ellipse cx="195" cy="321" rx="92" ry="112" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="8 8" opacity="0.95"/>
<circle cx="195" cy="335" r="146" fill="none" stroke="#E2E7EF" stroke-width="4"/>
<!-- Countdown (component) -->
<text x="195" y="508" text-anchor="middle" font-size="14" font-weight="600" fill="#10233F" xml:space="preserve">00:15</text>
<!-- PersistentBanner (offline) -->
<rect x="24" y="537" width="342" height="62" rx="16" fill="url(#g-glass)" stroke="url(#g-edge)" stroke-width="1.2"/>
<rect x="24" y="537" width="342" height="62" rx="16" fill="#EAF0FF" opacity="0.7"/>
<g transform="translate(40 558.0) scale(0.8333)" fill="none" stroke="#5B7CFA" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/></g>
<text x="72" y="562.1" text-anchor="start" font-size="13" font-weight="400" fill="#10233F" xml:space="preserve">You're offline. Check your connection and try</text>
<text x="72" y="581.1" text-anchor="start" font-size="13" font-weight="400" fill="#10233F" xml:space="preserve">again.</text>
<!-- Bottom action area -->
<!-- Button disabled: "Start" -->
<rect x="24" y="738" width="342" height="56" rx="28.0" fill="#D8DDE5"/>
<text x="195.0" y="772" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF" xml:space="preserve">Start</text>
<!-- TopBar (shared component, owner: Girish) y 47-103 -->
<!-- Back button → 07 -->
<rect x="14" y="53" width="44" height="44" rx="22" fill="url(#g-glass)" stroke="url(#g-edge)" stroke-width="1.2" filter="url(#sh-card)"/>
<g transform="translate(24 63)" fill="none" stroke="#10233F" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></g>
<rect class="hit" data-hit="back" x="12" y="51" width="48" height="48" fill="#FFFFFF" fill-opacity="0"/>
<!-- Status bar (safe area 0-47) -->
<text x="40" y="32" font-size="15" font-weight="600" fill="#10233F">9:41</text>
<g fill="#10233F"><rect x="290" y="24" width="3" height="6" rx="1"/><rect x="295" y="21" width="3" height="9" rx="1"/><rect x="300" y="18" width="3" height="12" rx="1"/><rect x="305" y="15" width="3" height="15" rx="1"/><path d="M314 20 a10 10 0 0 1 14 0 l-2 2 a7 7 0 0 0 -10 0 Z M318 24 a4.5 4.5 0 0 1 6 0 l-3 3 Z"/><rect x="334" y="17" width="22" height="12" rx="3" fill="none" stroke="#10233F" stroke-width="1.2"/><rect x="336" y="19" width="16" height="8" rx="1.5" fill="#10233F"/><rect x="357.5" y="21" width="1.6" height="4" rx="0.8"/></g>
<rect x="128" y="826" width="134" height="5" rx="2.5" fill="#10233F"/>
