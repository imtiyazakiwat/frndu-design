<!-- Accordion "How am I charged for a call?" -->
<text x="24" y="265.2" text-anchor="start" font-size="15" font-weight="500" fill="#10233F" xml:space="preserve">How am I charged for a call?</text>
<g transform="translate(346 251.0) scale(0.8333)" fill="none" stroke="#66758A" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></g>
<rect class="hit" data-hit="faq:How am I charged for a c" x="24" y="233" width="342" height="56" fill="#FFFFFF" fill-opacity="0"/>
<text x="24" y="304.2" text-anchor="start" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">The first minute is charged when the call</text>
<text x="24" y="326.2" text-anchor="start" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">connects. After that, each new minute is charged</text>
<text x="24" y="348.2" text-anchor="start" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">at the start of the minute. If the call never</text>
<text x="24" y="370.2" text-anchor="start" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">connects, the first minute is refunded</text>
<text x="24" y="392.2" text-anchor="start" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">automatically.</text>
<text x="24" y="433" text-anchor="start" font-size="13" font-weight="400" fill="#66758A" xml:space="preserve">Was this helpful?</text>
<rect x="160" y="415" width="58" height="32" rx="16.0" fill="url(#g-blue)" filter="url(#gl-blue)"/><text x="189.0" y="436.0" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF" xml:space="preserve">Yes</text><rect class="hit" data-hit="chip:Yes" x="160" y="415" width="58" height="32" fill="#FFFFFF" fill-opacity="0"/><rect x="226" y="415" width="50" height="32" rx="16.0" fill="url(#g-glass)" stroke="url(#g-edge)" stroke-width="1.2"/><text x="251.0" y="436.0" text-anchor="middle" font-size="14" font-weight="600" fill="#10233F" xml:space="preserve">No</text><rect class="hit" data-hit="chip:No" x="226" y="415" width="50" height="32" fill="#FFFFFF" fill-opacity="0"/>
<rect x="24" y="459" width="342" height="1" fill="#EEF1F5"/>
