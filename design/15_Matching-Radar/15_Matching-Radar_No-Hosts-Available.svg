<text x="195" y="374.3" text-anchor="middle" font-size="26" font-weight="700" fill="#10233F" letter-spacing="-0.4" xml:space="preserve">No hosts available</text>
<text x="195" y="408.3" text-anchor="middle" font-size="26" font-weight="700" fill="#10233F" letter-spacing="-0.4" xml:space="preserve">right now</text><text x="195" y="441.2" text-anchor="middle" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">Try again in a moment.</text>
