<rect x="24" y="670" width="342" height="56" rx="28.0" fill="url(#g-blue)" filter="url(#gl-blue)"/><rect x="25" y="671" width="340" height="28.0" rx="27.0" fill="#FFFFFF" opacity="0.10"/>
