<text x="195" y="239.3" text-anchor="middle" font-size="26" font-weight="700" fill="#10233F" letter-spacing="-0.4" xml:space="preserve">Let's get you set up</text>
<text x="195" y="272.2" text-anchor="middle" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">We'll ask for three permissions so calls</text>
<text x="195" y="294.2" text-anchor="middle" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">and updates work.</text>
<rect x="24.75" y="321.75" width="340.5" height="70.5" rx="16" fill="#FFFFFF" stroke="#EEF1F5" stroke-width="1.5"/>
<circle cx="64" cy="357" r="24" fill="#FDE8E8"/><g transform="translate(52 345)" fill="none" stroke="#E94B4B" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></g>
<text x="104" y="351" text-anchor="start" font-size="15" font-weight="700" fill="#10233F" xml:space="preserve">Camera</text>
<text x="104" y="370.1" text-anchor="start" font-size="13" font-weight="400" fill="#66758A" xml:space="preserve">So you and your host can see each other</text>
<text x="104" y="389.1" text-anchor="start" font-size="13" font-weight="400" fill="#66758A" xml:space="preserve">on video calls.</text>
<rect x="24.75" y="401.75" width="340.5" height="70.5" rx="16" fill="#FFFFFF" stroke="#EEF1F5" stroke-width="1.5"/>
<circle cx="64" cy="437" r="24" fill="#EAF0FF"/><g transform="translate(52 425)" fill="none" stroke="#5B7CFA" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></g>
<text x="104" y="431" text-anchor="start" font-size="15" font-weight="700" fill="#10233F" xml:space="preserve">Microphone</text>
<text x="104" y="450.1" text-anchor="start" font-size="13" font-weight="400" fill="#66758A" xml:space="preserve">So you can talk on voice and video calls.</text>
<rect x="24.75" y="481.75" width="340.5" height="70.5" rx="16" fill="#FFFFFF" stroke="#EEF1F5" stroke-width="1.5"/>
<circle cx="64" cy="517" r="24" fill="#FFF9EA"/><g transform="translate(52 505)" fill="none" stroke="#E6A21A" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></g>
<text x="104" y="511" text-anchor="start" font-size="15" font-weight="700" fill="#10233F" xml:space="preserve">Notifications</text>
<text x="104" y="530.1" text-anchor="start" font-size="13" font-weight="400" fill="#66758A" xml:space="preserve">So you don't miss incoming calls and</text>
<text x="104" y="549.1" text-anchor="start" font-size="13" font-weight="400" fill="#66758A" xml:space="preserve">messages.</text>
