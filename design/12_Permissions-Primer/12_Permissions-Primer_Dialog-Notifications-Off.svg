<text x="48" y="360.2" text-anchor="start" font-size="22" font-weight="700" fill="#10233F" letter-spacing="-0.2" xml:space="preserve">Notifications are off</text>
<text x="48" y="392.2" text-anchor="start" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">Turn them on in Settings so you don't</text>
<text x="48" y="414.2" text-anchor="start" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">miss calls.</text>
