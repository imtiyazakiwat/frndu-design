<text x="40" y="1341" text-anchor="start" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">Emergency</text>
<text x="350" y="1341" text-anchor="end" font-size="15" font-weight="500" fill="#10233F" xml:space="preserve">112</text>
<text x="40" y="1373" text-anchor="start" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">Cyber crime helpline</text>
<text x="350" y="1373" text-anchor="end" font-size="15" font-weight="500" fill="#10233F" xml:space="preserve">1930</text>
<text x="24" y="1425.1" text-anchor="start" font-size="13" font-weight="400" fill="#66758A" xml:space="preserve">Frndu is for adults 18+ only. Numbers to be confirmed by</text>
<text x="24" y="1444.1" text-anchor="start" font-size="13" font-weight="400" fill="#66758A" xml:space="preserve">Legal before launch.</text>
</g></g>
