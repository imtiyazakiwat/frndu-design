<ellipse cx="320" cy="179" rx="54" ry="44" fill="#FFFFFF" opacity="1.0" transform="rotate(0 320 179)"/>
<g transform="translate(296 155) scale(2.0000)" fill="none" stroke="#5B7CFA" stroke-width="1.00" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></g>
<text x="44" y="153.0" text-anchor="start" font-size="18" font-weight="700" fill="#10233F" xml:space="preserve">Your safety comes first</text><text x="44" y="178.1" text-anchor="start" font-size="13" font-weight="400" fill="#66758A" xml:space="preserve">Tips, tools and help if something</text>
<text x="44" y="197.1" text-anchor="start" font-size="13" font-weight="400" fill="#66758A" xml:space="preserve">goes wrong.</text>
<text x="24" y="282" text-anchor="start" font-size="14" font-weight="600" fill="#66758A" xml:space="preserve">Safety tips</text>
<rect x="24" y="295" width="342" height="92" rx="20" fill="url(#g-glass)" stroke="url(#g-edge)" stroke-width="1.2"/><circle cx="60" cy="331" r="20" fill="#EAF0FF"/><g transform="translate(48 319)" fill="none" stroke="#5B7CFA" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g><text x="96" y="327" text-anchor="start" font-size="15" font-weight="600" fill="#10233F" xml:space="preserve">Keep personal details private</text><text x="96" y="348.1" text-anchor="start" font-size="13" font-weight="400" fill="#66758A" xml:space="preserve">Never share your phone number, address,</text>
<text x="96" y="367.1" text-anchor="start" font-size="13" font-weight="400" fill="#66758A" xml:space="preserve">OTPs or bank details.</text>
<rect x="24" y="399" width="342" height="92" rx="20" fill="url(#g-glass)" stroke="url(#g-edge)" stroke-width="1.2"/><circle cx="60" cy="435" r="20" fill="#EAF0FF"/><g transform="translate(48 423)" fill="none" stroke="#5B7CFA" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/></g><text x="96" y="431" text-anchor="start" font-size="15" font-weight="600" fill="#10233F" xml:space="preserve">Never send money</text><text x="96" y="452.1" text-anchor="start" font-size="13" font-weight="400" fill="#66758A" xml:space="preserve">Frndu staff and hosts will never ask you</text>
<text x="96" y="471.1" text-anchor="start" font-size="13" font-weight="400" fill="#66758A" xml:space="preserve">for money or gift cards.</text>
<rect x="24" y="503" width="342" height="92" rx="20" fill="url(#g-glass)" stroke="url(#g-edge)" stroke-width="1.2"/><circle cx="60" cy="539" r="20" fill="#EAF0FF"/><g transform="translate(48 527)" fill="none" stroke="#5B7CFA" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></g><text x="96" y="535" text-anchor="start" font-size="15" font-weight="600" fill="#10233F" xml:space="preserve">Stay on Frndu</text><text x="96" y="556.1" text-anchor="start" font-size="13" font-weight="400" fill="#66758A" xml:space="preserve">Don't move to other apps. We can only</text>
<text x="96" y="575.1" text-anchor="start" font-size="13" font-weight="400" fill="#66758A" xml:space="preserve">protect you here.</text>
<rect x="24" y="607" width="342" height="92" rx="20" fill="url(#g-glass)" stroke="url(#g-edge)" stroke-width="1.2"/><circle cx="60" cy="643" r="20" fill="#EAF0FF"/><g transform="translate(48 631)" fill="none" stroke="#5B7CFA" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></g><text x="96" y="639" text-anchor="start" font-size="15" font-weight="600" fill="#10233F" xml:space="preserve">Spot scams</text><text x="96" y="660.1" text-anchor="start" font-size="13" font-weight="400" fill="#66758A" xml:space="preserve">Be careful with links, urgent requests or</text>
<text x="96" y="679.1" text-anchor="start" font-size="13" font-weight="400" fill="#66758A" xml:space="preserve">offers that sound too good.</text>
<text x="24" y="738" text-anchor="start" font-size="14" font-weight="600" fill="#66758A" xml:space="preserve">How we protect you</text>
<rect x="24" y="751" width="342" height="92" rx="20" fill="url(#g-glass)" stroke="url(#g-edge)" stroke-width="1.2"/><circle cx="60" cy="787" r="20" fill="#FFF9EA"/><g transform="translate(48 775)" fill="none" stroke="#10233F" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/><path d="m9 12 2 2 4-4"/></g><text x="96" y="783" text-anchor="start" font-size="15" font-weight="600" fill="#10233F" xml:space="preserve">Verified hosts</text><text x="96" y="804.1" text-anchor="start" font-size="13" font-weight="400" fill="#66758A" xml:space="preserve">Every host passes a video check before</text>
<text x="96" y="823.1" text-anchor="start" font-size="13" font-weight="400" fill="#66758A" xml:space="preserve">taking calls.</text>
<rect x="24" y="855" width="342" height="92" rx="20" fill="url(#g-glass)" stroke="url(#g-edge)" stroke-width="1.2"/><circle cx="60" cy="891" r="20" fill="#FFF9EA"/><g transform="translate(48 879)" fill="none" stroke="#10233F" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></g><text x="96" y="887" text-anchor="start" font-size="15" font-weight="600" fill="#10233F" xml:space="preserve">Contact details hidden</text><text x="96" y="908.1" text-anchor="start" font-size="13" font-weight="400" fill="#66758A" xml:space="preserve">Phone numbers and emails in chat are</text>
<text x="96" y="927.1" text-anchor="start" font-size="13" font-weight="400" fill="#66758A" xml:space="preserve">hidden automatically.</text>
<rect x="24" y="959" width="342" height="73" rx="20" fill="url(#g-glass)" stroke="url(#g-edge)" stroke-width="1.2"/><circle cx="60" cy="995" r="20" fill="#FFF9EA"/><g transform="translate(48 983)" fill="none" stroke="#10233F" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></g><text x="96" y="991" text-anchor="start" font-size="15" font-weight="600" fill="#10233F" xml:space="preserve">Calls are moderated</text><text x="96" y="1012.1" text-anchor="start" font-size="13" font-weight="400" fill="#66758A" xml:space="preserve">We blur and end calls that break our rules.</text>
