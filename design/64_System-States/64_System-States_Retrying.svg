<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="'Plus Jakarta Sans', Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
<title>Frndu – 64 System States – Retrying (390 x 844)</title>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap');</style>
<clipPath id="screen"><rect width="390" height="844"/></clipPath>
<filter id="sh-card" x="-30%" y="-40%" width="160%" height="200%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#5B7CFA" flood-opacity="0.08"/></filter>
<filter id="sh-lg" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="-8" stdDeviation="24" flood-color="#10233F" flood-opacity="0.10"/></filter>
<filter id="sh-sm" x="-30%" y="-50%" width="160%" height="220%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10233F" flood-opacity="0.06"/></filter>
<filter id="gl-blue" x="-30%" y="-60%" width="160%" height="260%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5B7CFA" flood-opacity="0.32"/></filter>
<filter id="gl-coral" x="-30%" y="-60%" width="160%" height="260%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#E94B4B" flood-opacity="0.30"/></filter>
<filter id="gl-red" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#D9363E" flood-opacity="0.30"/></filter>
<filter id="blur-xl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
<filter id="blur-md" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
<linearGradient id="g-glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.82"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.56"/></linearGradient>
<linearGradient id="g-edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.35"/></linearGradient>
<linearGradient id="g-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B7CFA" stop-opacity="0.82"/><stop offset="1" stop-color="#5B7CFA"/></linearGradient>
<linearGradient id="g-coral" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E94B4B" stop-opacity="0.84"/><stop offset="1" stop-color="#E94B4B"/></linearGradient>
<linearGradient id="g-fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF4D6" stop-opacity="0"/><stop offset="0.55" stop-color="#FFF4D6" stop-opacity="0.85"/><stop offset="1" stop-color="#FFF4D6" stop-opacity="0.95"/></linearGradient>
<radialGradient id="g-halo"><stop offset="0" stop-color="#5B7CFA" stop-opacity="0.20"/><stop offset="1" stop-color="#5B7CFA" stop-opacity="0"/></radialGradient>
</defs>
<g clip-path="url(#screen)">
<rect width="390" height="844" fill="#FFF4D6"/>
<!-- Background clouds (decorative): blurred Blue top-right, Coral bottom-left -->
<g filter="url(#blur-xl)"><path d="M210 -40 C200 40 240 96 286 120 C330 142 336 210 380 250 L460 260 L460 -40 Z" fill="#5B7CFA" class="cl-b1" opacity="0.50"/><ellipse cx="372" cy="70" rx="90" ry="110" fill="#5B7CFA" class="cl-b2" opacity="0.30"/></g><path d="M300 -10 C292 70 330 150 400 196" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1.5"/>
<g filter="url(#blur-xl)"><path d="M-60 560 C20 560 80 620 110 690 C130 740 170 800 200 900 L-60 900 Z" fill="#E94B4B" class="cl-c1" opacity="0.35"/><ellipse cx="0" cy="760" rx="110" ry="120" fill="#E94B4B" class="cl-c2" opacity="0.17"/></g><path d="M-10 640 C60 660 100 720 112 800" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5"/>
<ellipse cx="195" cy="256" rx="84.0" ry="63.839999999999996" fill="#EAF0FF" opacity="1.0" transform="rotate(0 195 256)"/><circle cx="195" cy="250" r="56.0" fill="#FFFFFF"/><g transform="translate(167.0 222.0) scale(2.3333)" fill="none" stroke="#5B7CFA" stroke-width="0.86" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/></g><!-- sparks --><path d="M249.0 184.0 l4.0 12.0" stroke="#E94B4B" stroke-width="4.5" stroke-linecap="round"/><path d="M263.0 194.0 l10.0 -7.0" stroke="#E94B4B" stroke-width="4.5" stroke-linecap="round"/>
<text x="195" y="362.3" text-anchor="middle" font-size="26" font-weight="700" fill="#10233F" letter-spacing="-0.4" xml:space="preserve">No internet connection</text>
<text x="195" y="395.2" text-anchor="middle" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">Check your Wi-Fi or mobile data and try</text>
<text x="195" y="417.2" text-anchor="middle" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">again.</text>
<!-- Bottom action area -->
<!-- Button primary loading: "Retry" → retry -->
<rect x="24" y="670" width="342" height="56" rx="28.0" fill="url(#g-blue)" filter="url(#gl-blue)"/><rect x="25" y="671" width="340" height="28.0" rx="27.0" fill="#FFFFFF" opacity="0.10"/>
<circle cx="195.0" cy="698.0" r="9" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2.4"/><path d="M195.0 689.0 a9 9 0 0 1 9 9" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
<!-- Button ghost: "Open Settings" → OS settings -->
<rect x="24" y="738" width="342" height="56" rx="28.0" fill="#FFFFFF" fill-opacity="0"/>
<text x="195.0" y="772" text-anchor="middle" font-size="16" font-weight="700" fill="#5B7CFA" xml:space="preserve">Open Settings</text>
<rect class="hit" data-hit="btn:Open Settings" x="24" y="738" width="342" height="56" fill="#FFFFFF" fill-opacity="0"/><!-- Status bar (safe area 0-47) -->
<text x="40" y="32" font-size="15" font-weight="600" fill="#10233F">9:41</text>
<g fill="#10233F"><rect x="290" y="24" width="3" height="6" rx="1"/><rect x="295" y="21" width="3" height="9" rx="1"/><rect x="300" y="18" width="3" height="12" rx="1"/><rect x="305" y="15" width="3" height="15" rx="1"/><path d="M314 20 a10 10 0 0 1 14 0 l-2 2 a7 7 0 0 0 -10 0 Z M318 24 a4.5 4.5 0 0 1 6 0 l-3 3 Z"/><rect x="334" y="17" width="22" height="12" rx="3" fill="none" stroke="#10233F" stroke-width="1.2"/><rect x="336" y="19" width="16" height="8" rx="1.5" fill="#10233F"/><rect x="357.5" y="21" width="1.6" height="4" rx="0.8"/></g><rect x="128" y="826" width="134" height="5" rx="2.5" fill="#10233F"/>
</g>
</svg>
