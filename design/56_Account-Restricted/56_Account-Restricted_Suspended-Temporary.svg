<rect class="hit" data-hit="btn:Contact Support" x="24" y="626" width="342" height="56" fill="#FFFFFF" fill-opacity="0"/>
<!-- Link "Community Guidelines" → 68 -->
<rect x="24" y="694" width="342" height="44" fill="#FFFFFF" fill-opacity="0"/><text x="195" y="721" text-anchor="middle" font-size="14" font-weight="600" fill="#5B7CFA" xml:space="preserve">Community Guidelines</text><rect class="hit" data-hit="link:Community Guidelines" x="24" y="694" width="342" height="44" fill="#FFFFFF" fill-opacity="0"/>
