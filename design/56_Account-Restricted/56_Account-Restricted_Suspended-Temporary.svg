<text x="195" y="308.3" text-anchor="middle" font-size="26" font-weight="700" fill="#10233F" letter-spacing="-0.4" xml:space="preserve">Account suspended until</text>
<text x="195" y="342.3" text-anchor="middle" font-size="26" font-weight="700" fill="#10233F" letter-spacing="-0.4" xml:space="preserve">17 Oct 2026</text>
<rect x="104" y="360" width="181" height="32" rx="16.0" fill="#FFF9EA" opacity="1.0"/><g transform="translate(116 367.0) scale(0.7500)" fill="none" stroke="#10233F" stroke-width="2.67" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></g><text x="140" y="381.0" text-anchor="start" font-size="14" font-weight="600" fill="#10233F" xml:space="preserve">6 days 14 hours left</text>
<rect x="24" y="416" width="342" height="122" rx="20" fill="url(#g-glass)" stroke="url(#g-edge)" stroke-width="1.2" filter="url(#sh-card)"/>
<text x="40" y="453" text-anchor="start" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">Reason</text>
<text x="350" y="453" text-anchor="end" font-size="15" font-weight="500" fill="#10233F" xml:space="preserve">Inappropriate content</text>
<text x="40" y="483" text-anchor="start" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">Reference ID</text>
<text x="350" y="483" text-anchor="end" font-size="15" font-weight="500" fill="#10233F" xml:space="preserve">MOD-55120</text>
<text x="40" y="513" text-anchor="start" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">Date</text>
<text x="350" y="513" text-anchor="end" font-size="15" font-weight="500" fill="#10233F" xml:space="preserve">10 Oct 2026</text>
<text x="24" y="569.2" text-anchor="start" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">You can’t make or take calls or send messages</text>
<text x="24" y="591.2" text-anchor="start" font-size="15" font-weight="400" fill="#66758A" xml:space="preserve">until then. Your diamonds stay in your wallet.</text>
